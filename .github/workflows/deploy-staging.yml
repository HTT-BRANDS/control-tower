# =============================================================================
# Azure Governance Platform - Staging Deployment Pipeline (GHCR)
# =============================================================================
# Trigger: Pushes to 'main' branch or manual workflow_dispatch
#
# Pipeline stages:
#   1. QA Gate       — lint + full unit/integration test suite (hard gate)
#   2. Security Scan — Trivy filesystem + pip-audit
#   3. Build Image   — docker build → GHCR (uses GITHUB_TOKEN)
#   4. Deploy        — az webapp restart picks up new :staging tag
#   5. Validation    — pytest staging suite against live URL
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID        — OIDC federated credential
#   AZURE_TENANT_ID        — HTT-CORE tenant
#   AZURE_SUBSCRIPTION_ID  — 32a28177-6fb2-4668-a528-6d6cafb9665e
# =============================================================================

name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit tests (emergency deploy only)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION:     '0.9.27'
  # GHCR Configuration — free for public repos, uses GITHUB_TOKEN
  GHCR_REGISTRY:    ghcr.io
  GHCR_REPOSITORY:  htt-brands/control-tower
  IMAGE_TAG:        staging
  # App Service — actual resource names (verified 2026-03-18)
  AZURE_APP_NAME:       app-governance-staging-xnczpwyv
  AZURE_RESOURCE_GROUP: rg-governance-staging
  STAGING_URL:          https://app-governance-staging-xnczpwyv.azurewebsites.net

permissions:
  id-token: write        # OIDC login
  contents: read
  security-events: write # Trivy SARIF upload
  packages: write        # GHCR push

# Staging is one mutable App Service, not an infinitely parallel test fixture.
# Cancel older pushes so they cannot restart the app under the newest run's
# validation suite.
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: QA Gate — hard gate, no continue-on-error
  # ===========================================================================
  qa-gate:
    name: QA Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}-v2

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Create CI tenant config
        run: |
          # Create tenants.yaml with OIDC enabled for CI testing
          cat > config/tenants.yaml << 'EOF'
          tenants:
            HTT:
              name: "Head-To-Toe (HTT)"
              code: "HTT"
              tenant_id: "00000000-0000-0000-a000-000000000001"
              app_id: "00000000-0000-0000-b000-000000000001"
              admin_email: "admin@example.com"
              domains:
                - "example.com"
              is_active: true
              is_riverside: true
              priority: 1
              oidc_enabled: true
            BCC:
              name: "Bishops (BCC)"
              code: "BCC"
              tenant_id: "00000000-0000-0000-a000-000000000002"
              app_id: "00000000-0000-0000-b000-000000000002"
              admin_email: "admin@example.com"
              domains:
                - "example.com"
              is_active: true
              is_riverside: true
              priority: 2
              oidc_enabled: true
            FN:
              name: "Frenchies (FN)"
              code: "FN"
              tenant_id: "00000000-0000-0000-a000-000000000003"
              app_id: "00000000-0000-0000-b000-000000000003"
              admin_email: "admin@example.com"
              domains:
                - "example.com"
              is_active: true
              is_riverside: true
              priority: 3
              oidc_enabled: true
            TLL:
              name: "Lash Lounge (TLL)"
              code: "TLL"
              tenant_id: "00000000-0000-0000-a000-000000000004"
              app_id: "00000000-0000-0000-b000-000000000004"
              admin_email: "admin@example.com"
              domains:
                - "example.com"
              is_active: true
              is_riverside: true
              priority: 4
              oidc_enabled: true
            DCE:
              name: "Delta Crown Extensions (DCE)"
              code: "DCE"
              tenant_id: "00000000-0000-0000-a000-000000000005"
              app_id: "00000000-0000-0000-b000-000000000005"
              admin_email: "admin@example.com"
              domains:
                - "example.com"
              is_active: true
              is_riverside: true
              priority: 5
              oidc_enabled: true
          EOF
          echo "Created config/tenants.yaml with OIDC enabled for all tenants"

      - name: Unit + integration tests
        if: ${{ inputs.skip_tests != 'true' }}
        # ``-m 'not visual'`` deselects browser-required visual-parity
        # tests (see tests/integration/test_sync_status_dark_mode.py).
        # The dedicated ``browser-smoke`` job in ci.yml owns that surface.
        run: uv run pytest tests/unit/ tests/integration/ -q --tb=short -m "not visual"
        env:
          ENVIRONMENT: development
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

  # ===========================================================================
  # Job 2: Security Scan
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: qa-gate

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref:  '.'
          format:    'sarif'
          output:    'trivy-fs.sarif'
          severity:  'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category:   trivy-filesystem-staging

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: pip-audit
        run: |
          # Export locked deps (no hashes — pip-audit doesn't support them)
          uv export --no-hashes --no-dev > /tmp/requirements.txt
          pip install pip-audit
          pip-audit -r /tmp/requirements.txt --desc --format=json --output=pip-audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-staging
          path: pip-audit.json

  # ===========================================================================
  # Job 3: Build Docker Image → GHCR
  # Builds and pushes to GitHub Container Registry using GITHUB_TOKEN
  # ===========================================================================
  build-image:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [qa-gate, security-scan]
    environment: staging

    outputs:
      image_full: ${{ steps.set-output.outputs.image_full }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:sha-${{ github.sha }}
          target: production
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Regression guard for incident a1sb (libodbc missing in dev image
      # shipped to prod). Staging images get promoted to prod via blue-green
      # swap, so this workflow is in-scope.
      # See .github/actions/verify-production-image/README.md
      - name: Verify production image (a1sb guard)
        uses: ./.github/actions/verify-production-image
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}@${{ steps.build.outputs.digest }}

      - name: Set image output
        id: set-output
        run: |
          IMAGE_FULL="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "image_full=${IMAGE_FULL}" >> "$GITHUB_OUTPUT"
          echo "Built: ${IMAGE_FULL}"

  # ===========================================================================
  # Job 4: Deploy — restart App Service (picks up new :staging tag from ACR)
  # ===========================================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set subscription context
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ct-wph: ensure Azure AD app settings are present on the staging webapp.
      # Before this step existed, staging webapp `app-governance-staging-xnczpwyv`
      # had all AZURE_AD_* env vars declared empty, breaking the browser login
      # flow with "Azure AD sign-in unavailable". Tyler patched it by hand on
      # 2026-05-19 with `az webapp config appsettings set`, but the next bicep
      # or workflow run could've wiped it again. This step makes the wiring
      # idempotent across every deploy.
      #
      # The four ground-truth values come from GitHub Secrets (see the
      # docs/runbooks/staging-secrets.md runbook for one-time setup). The
      # other five values are DERIVED from the tenant ID via the Azure AD
      # discovery URL convention, so we compute them in shell rather than
      # storing duplicate secrets.
      #
      # If the four required secrets aren't set yet, the step skips with a
      # clear log line — that keeps existing branch deploys green while
      # Tyler walks through the one-time secret-setup runbook, instead of
      # red-locking the pipeline until every PR is gated on his keyboard.
      - name: Configure Azure AD app settings (ct-wph)
        env:
          STAGING_AZURE_AD_TENANT_ID:     ${{ secrets.STAGING_AZURE_AD_TENANT_ID }}
          STAGING_AZURE_AD_CLIENT_ID:     ${{ secrets.STAGING_AZURE_AD_CLIENT_ID }}
          STAGING_AZURE_AD_CLIENT_SECRET: ${{ secrets.STAGING_AZURE_AD_CLIENT_SECRET }}
          STAGING_ADMIN_EMAILS:           ${{ secrets.STAGING_ADMIN_EMAILS }}
        run: |
          set -euo pipefail

          if [ -z "${STAGING_AZURE_AD_TENANT_ID:-}" ] || \
             [ -z "${STAGING_AZURE_AD_CLIENT_ID:-}" ] || \
             [ -z "${STAGING_AZURE_AD_CLIENT_SECRET:-}" ]; then
            echo "::warning::ct-wph: STAGING_AZURE_AD_* secrets not set; skipping Azure AD wiring."
            echo "::warning::See docs/runbooks/staging-secrets.md for one-time setup."
            exit 0
          fi

          # Derive the discovery endpoints from the tenant ID. These mirror
          # the bicep template's az.environment().authentication.loginEndpoint
          # logic in infrastructure/modules/app-service.bicep, so a future
          # bicep redeploy and this script agree on the same values.
          login_base="https://login.microsoftonline.com/${STAGING_AZURE_AD_TENANT_ID}"
          authority="${login_base}"
          issuer="${login_base}/v2.0"
          token_endpoint="${login_base}/oauth2/v2.0/token"
          authorization_endpoint="${login_base}/oauth2/v2.0/authorize"
          jwks_uri="${login_base}/discovery/v2.0/keys"

          # ADMIN_EMAILS is optional — staging may want a different admin
          # list than prod, but we default to empty rather than dragging
          # production admins into a staging deploy by accident.
          admin_emails="${STAGING_ADMIN_EMAILS:-}"

          echo "Setting 9 Azure AD app settings on staging webapp..."
          az webapp config appsettings set \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings \
              "AZURE_AD_TENANT_ID=${STAGING_AZURE_AD_TENANT_ID}" \
              "AZURE_AD_CLIENT_ID=${STAGING_AZURE_AD_CLIENT_ID}" \
              "AZURE_AD_CLIENT_SECRET=${STAGING_AZURE_AD_CLIENT_SECRET}" \
              "AZURE_AD_AUTHORITY=${authority}" \
              "AZURE_AD_ISSUER=${issuer}" \
              "AZURE_AD_TOKEN_ENDPOINT=${token_endpoint}" \
              "AZURE_AD_AUTHORIZATION_ENDPOINT=${authorization_endpoint}" \
              "AZURE_AD_JWKS_URI=${jwks_uri}" \
              "ADMIN_EMAILS=${admin_emails}" \
            --output none
          echo "✅ Azure AD settings applied to staging webapp"

      - name: Update container image and restart App Service
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pass GHCR credentials so App Service can pull the (internal) image.
          # Prefer GHCR_PAT (a long-lived PAT with read:packages scope) over
          # GITHUB_TOKEN, which expires after the workflow ends. Without a PAT,
          # App Service restarts outside CI may fail to re-pull the image.
          GHCR_PASSWORD="${GHCR_PAT:-$GITHUB_TOKEN}"
          az webapp config container set \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --container-image-name ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            --container-registry-url https://${{ env.GHCR_REGISTRY }} \
            --container-registry-user ${{ github.repository_owner }} \
            --container-registry-password "$GHCR_PASSWORD"
          az webapp config appsettings set \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings WEBSITE_HEALTHCHECK_MAXPINGFAILURES=3 \
            --output none
          az webapp config set \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --always-on true \
            --generic-configurations '{"healthCheckPath":"/health"}' \
            --output none
          az webapp restart \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Health gate readiness loop
        # NOTE (ct-czv AC #3): this gate intentionally hits /health (basic 200
        # liveness), not /health/detailed. Staging legitimately omits Azure-AD
        # credentials, which causes /health/detailed to report `degraded` via
        # the tri-state `azure_configured` rollup added in PR #41. Gating on
        # /health/detailed would therefore fail every staging deploy on expected
        # configuration. See docs/HEALTH_GATE_DESIGN.md before changing this.
        run: |
          set -uo pipefail

          max_attempts=12
          sleep_seconds=20
          health_url="${{ env.STAGING_URL }}/health"

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Health attempt ${attempt}/${max_attempts}: ${health_url}"
            set +e
            http_code=$(curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 30 \
              --output /tmp/staging-health-body.txt \
              --write-out "%{http_code}" \
              "$health_url")
            curl_exit=$?
            set -e
            body=$(cat /tmp/staging-health-body.txt 2>/dev/null || true)

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ]; then
              echo "✅ Health check passed"
              cat /tmp/staging-health-body.txt
              exit 0
            fi

            echo "Health not ready: curl_exit=${curl_exit}, http_code=${http_code}, body=${body}"
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$sleep_seconds"
            fi
          done

          echo "❌ Staging did not become healthy after $((max_attempts * sleep_seconds)) seconds"
          az webapp show \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query '{state:state, availabilityState:availabilityState, hostNames:hostNames}' \
            --output json || true
          az webapp config show \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query '{alwaysOn:alwaysOn, healthCheckPath:healthCheckPath, linuxFxVersion:linuxFxVersion}' \
            --output json || true
          timeout 30s az webapp log tail \
            --name ${{ env.AZURE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            2>&1 | sed -n '1,120p' || true
          exit 1

      - name: Namespace warmup (pre-validate module imports)
        # NOTE (ct-aw4): the /health gate above only warms the core FastAPI app.
        # Routers in separate modules (notably /monitoring/*) are not imported
        # until their first request arrives. On Azure B1, that first import can
        # exceed the validation suite's 30s read timeout, causing flaky CI
        # failures even though deploy itself succeeded. This step hits each
        # major route prefix once with a generous timeout so module imports
        # complete BEFORE the validate job starts.
        #
        # Accept ANY non-zero HTTP status as success — we only care that the
        # module loaded, not what it returns. Only true read-timeouts or
        # connection failures count as warmup failures, and even those don't
        # block the deploy (validate job will catch real regressions).
        run: |
          set -uo pipefail

          warmup_paths=(
            /api/v1/auth/health
            /api/v1/costs/summary
            /api/v1/compliance/summary
            /api/v1/identity/summary
            /api/v1/resources
            /api/v1/sync/status
            /api/v1/preflight/status
            /api/v1/recommendations
            /api/v1/riverside/summary
            /monitoring/performance
            /monitoring/cache
          )

          warmup_failures=0
          warmup_total=${#warmup_paths[@]}

          echo "Warming up ${warmup_total} route prefixes (60s budget each)..."
          for path in "${warmup_paths[@]}"; do
            url="${{ env.STAGING_URL }}${path}"
            set +e
            http_code=$(curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 60 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$url")
            curl_exit=$?
            timing=$(curl --silent --location \
              --connect-timeout 10 \
              --max-time 5 \
              --output /dev/null \
              --write-out "%{time_total}" \
              "$url" 2>/dev/null || echo "n/a")
            set -e

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" != "000" ]; then
              echo "  ✅ ${path} → ${http_code} (post-warmup: ${timing}s)"
            else
              echo "  ⚠️  ${path} → curl_exit=${curl_exit} http_code=${http_code} (still cold?)"
              warmup_failures=$((warmup_failures + 1))
            fi
          done

          if [ "$warmup_failures" -gt 0 ]; then
            echo "::warning::${warmup_failures}/${warmup_total} routes failed warmup — validation may flake"
          else
            echo "🔥 All ${warmup_total} route prefixes warmed up successfully"
          fi

  # ===========================================================================
  # Job 5: Staging Validation — pytest suite against live URL
  # ===========================================================================
  validate:
    name: Staging Validation Tests
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run staging validation suite
        run: |
          uv run pytest tests/staging/ \
            -v --tb=short \
            --staging-url="${{ env.STAGING_URL }}"
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
          # Tests only make HTTP requests to the live URL; ENVIRONMENT=development
          # prevents Settings() from requiring CORS_ORIGINS during import.
          ENVIRONMENT: development

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-test-results
          path: staging-results.xml
